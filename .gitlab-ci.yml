# Mirror of .github/workflows/ci.yml -- this repo pushes to both remotes, so
# both need the guards. Keep the two in sync.
stages: [test]

lint-and-typecheck:
  stage: test
  image: node:22
  script:
    - node --check scripts/retention/purge-expired-media.mjs
    - bash -n scripts/check-deployed-functions.sh
    - cd frontend && npm ci && npm run typecheck && npm test

# Split into its own job (rather than added to lint-and-typecheck's node:22
# image) because this was missing here entirely until GitHub's equivalent
# `deno lint` step caught pre-existing lint violations that GitLab's mirror
# never ran -- see .github/workflows/ci.yml.
lint-edge-functions:
  stage: test
  image: denoland/deno:latest
  script:
    - deno lint supabase/functions
    - deno test --no-lock supabase/functions/_shared/

unit-tests:
  stage: test
  image: node:22
  script:
    - cd n8n/schemas && npm ci && npm test
    - node --test n8n/scripts/check-n8n-credential-scopes.test.mjs

repo-guards:
  stage: test
  image: node:22
  script:
    - node scripts/check-conference-writers.mjs
    - node scripts/check-no-auto-confirm.mjs
    - node --test scripts/check-no-auto-confirm.test.mjs
    - node scripts/check-auth-signout.mjs
    - bash scripts/check-deployed-functions.sh
