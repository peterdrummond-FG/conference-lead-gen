# Audit Q1. This repo had zero tests, zero lint config and zero CI across four
# runtimes; every fix in its history is a narrowly-scoped post-incident fix,
# which is the signature of a codebase with no regression net.
#
# The two `guards` jobs are the highest-value part: they are what stop the
# specific problems this audit found from recurring silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Lint Edge Functions
        run: deno lint supabase/functions
      - name: Edge Function unit tests
        run: deno test --no-lock supabase/functions/_shared/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Typecheck frontend
        run: cd frontend && npm run typecheck
      # Review's Smart view rules and the onboarding tour's copy and scene lengths.
      # Without this step they only ran on a developer's machine, so editing a tour
      # scene without updating tourLengths.ts would have passed CI.
      - name: Frontend unit tests
        run: cd frontend && npm test

      - name: Check scripts parse
        run: |
          node --check scripts/retention/purge-expired-media.mjs
          bash -n scripts/check-deployed-functions.sh

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd n8n/schemas && npm ci && npm test
      - run: node --test n8n/scripts/check-n8n-credential-scopes.test.mjs

  guards:
    name: Repo guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # audit A1/A2 (skills sandboxed, no credentials) was scripts/check-skill-profiles.mjs
      # for the retired local agent; on n8n it is n8n/scripts/check-n8n-credential-scopes.mjs,
      # which needs a workflow export and is run by hand (see n8n/README.md).

      # One conference everywhere: nothing writes profiles.current_event_id
      # directly, and the webhook re-checks is_active for a bound phone.
      - name: Conference writers
        run: node scripts/check-conference-writers.mjs
      # Nothing is auto-confirmed (Peter, 2026-10-06): only a person's Confirm writes
      # review_status 'approved'. The test plants a violation and expects red.
      - name: No auto-confirm
        run: node scripts/check-no-auto-confirm.mjs && node --test scripts/check-no-auto-confirm.test.mjs
      - name: Check nothing signs an account out of every device
        run: node scripts/check-auth-signout.mjs

      # audit N1: a deployed function with no source in the repo, or a
      # "retired" one that doesn't actually answer 410.
      - name: Deployed-function drift
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/check-deployed-functions.sh

      # audit Q9: retired concepts should not linger as live CODE. Prose that
      # explains what replaced the staff PIN is fine and expected -- this
      # looks for actual usage (a call, or the header being read/sent).
      - name: No live staff-PIN code
        run: |
          if git grep -nE 'requireStaffPin\(|headers\[.x-staff-pin|get\(.x-staff-pin' \
               -- ':!supabase/migrations' ':!audit' ':!docs' ':!*.md'; then
            echo "Live staff-PIN code outside migrations/docs (audit Q9)" >&2
            exit 1
          fi
