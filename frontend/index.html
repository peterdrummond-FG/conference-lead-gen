<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>">
    <!--
      Stage 15: connect-src must reach the Supabase Edge Functions origin in
      BOTH dev and the production build — this directive used to be dev-only
      and scoped to 'self' only, which made sense when every API call was
      same-origin (the old /api proxy to the local .NET backend). Missing
      this in the production build would have silently broken every API
      call on Vercel, not just local dev. img-src needs blob: too, now that
      contacts-photo/export-csv are fetched via axios and rendered/
      downloaded from object URLs instead of a same-origin <img src>.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self' https://*.supabase.co<% if (ctx.dev) { %> ws://localhost:*<% } %>;<% if (ctx.dev) { %> worker-src 'self' blob:;<% } %>"
    />
    <!--
      Audit S9. This meta CSP stays the source of truth for script-src (no
      unsafe-inline) -- frontend/vercel.json's headers add frame-ancestors,
      HSTS, X-Content-Type-Options, Referrer-Policy and Permissions-Policy,
      none of which a <meta> tag can deliver (frame-ancestors is silently
      ignored there, and the rest are header-only by definition; a meta CSP
      also only covers the HTML document, not every response Vercel serves).
      vercel.json's CSP header is deliberately ONLY frame-ancestors, since the
      two policies combine as an intersection -- duplicating this policy
      there would mean keeping two copies in sync and breaking the app
      whenever they drift. (This used to live in a vercel.json `$comment`
      key; Vercel's schema validator rejects unknown properties there and
      silently failed every deploy for it -- see git blame.)
    -->

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
